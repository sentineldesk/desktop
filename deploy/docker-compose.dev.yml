# The room runtime's DEVELOPMENT HARNESS — one desktop container, driven by
# hand, without the front desk. This is NOT a deployment mode: SentinelDesk is
# deployed as work rooms through the front desk (docs/INSTALL.md), which
# starts room containers itself over the Docker Engine API. What this file is
# for is the loop CLAUDE.md calls "real verification of the desktop": `make
# up`, open https://localhost:8080 (self-signed, accept the warning once —
# the certificate persists in the home volume), and exercise the runtime —
# pipelines, tools, the embedded client — with nothing else in the way.
#
# The standalone product mode this file used to anchor (hardware compose
# variants, Caddy TLS profiles, the one-command installer) was retired on
# 2026-08-14. TLS, auth policy and public exposure are the front desk's job
# now; this harness stays HTTP on localhost, which is all a dev loop needs.
# ─────────────────────────────────────────────────────────────────────────────
# Pinned so the stack does not depend on which directory holds this file.
# Compose otherwise derives the project name from the parent directory, and both
# container names and volume names carry that prefix — moving the file silently
# orphans the running containers and hides the persistent home behind a fresh,
# empty volume.
name: sentineldesk

services:
  sentineldesk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Pinned to the lite stage, and it has to be said out loud because the
      # default is wrong here: the Dockerfile's LAST stage is `full`, so a bare
      # `docker compose up -d --build` would build full — LibreOffice, Firefox,
      # GIMP, Wireshark, and on amd64 Steam and Wine, some 2.5 GB of it — and
      # then tag that as sentineldesk:latest.
      #
      # That name means lite everywhere else: the Makefile builds it with
      # --target desktop, and the README documents :latest as an alias of
      # :lite. Without this line, which image `sentineldesk:latest` refers to
      # depends on whether somebody typed `make up` or `docker compose --build`,
      # and nothing anywhere says so.
      target: desktop
    image: sentineldesk:latest
    container_name: sentineldesk
    environment:
      - FPS=${FPS:-30}
      # One image pins every workspace; several are dealt across the four.
      - WALLPAPER=${WALLPAPER:-}
      # auto detects NVENC → VA-API → software VP8; also: nvenc|vaapi|h264|vp8
      - ENCODER=auto
      - VIDEO_BITRATE_KBPS=8000
      # Web client login (empty = no auth, development only)
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
      # The ICE configuration handed to the browser
      - CLIENT_STUN=stun:stun.l.google.com:19302
      - CLIENT_TURN_URLS=turn:${TURN_HOST:-localhost}:3478?transport=udp,turn:${TURN_HOST:-localhost}:3478?transport=tcp
      - TURN_USER=${TURN_USER:-webrtc}
      - TURN_PASS=${TURN_PASS:-webrtc123}
      # A fixed UDP range for the container's ICE (mapped below)
      - WEBRTC_MIN_PORT=59000
      - WEBRTC_MAX_PORT=59049
      # Clock and keyboard, read at start so one image serves every region.
      # TZ: a tzdata name (America/Argentina/Buenos_Aires, Europe/Madrid…).
      # KEYBOARD_LAYOUT: an X layout code or comma list — the default us,es
      # gives the panel both and Alt+Shift switches; latam, pt, fr, de…
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - KEYBOARD_LAYOUT=${KEYBOARD_LAYOUT:-us,es}
      - KEYBOARD_VARIANT=${KEYBOARD_VARIANT:-}
    # Published ports on a bridge, NOT network_mode: host — and this file is the
    # one place where that is the right way round.
    #
    # The production files (cpu/nvidia/vaapi) use host networking because on
    # Linux "the host" is the machine, so ICE connects straight over UDP and the
    # LAN is reachable both ways. This file is for Docker Desktop, where "the
    # host" is the Linux VM instead. Measured on macOS:
    #
    #     --network host   → eth0 192.168.65.3/24   (the VM's own network)
    #     bridge           → eth0 172.17.0.2/16     (reachable, ports forwarded)
    #
    # In host mode the desktop answers on the VM and nothing forwards it, so
    # http://localhost:8080 stops resolving from the Mac — verified, curl
    # returns nothing at all. Published ports are what make the desktop
    # reachable from this machine AND from other machines on its LAN.
    ports:
      - "8080:8080"
      - "59000-59049:59000-59049/udp"
      # The desktop's own STUN: browsers ask IT "what is my address?" and no
      # third-party server sits in the path. STUN_EMBEDDED=0 turns it off.
      - "3478:3478/udp"
    volumes:
      # A persistent home (browser profiles, the Steam library, and so on)
      - sentineldesk-home:/home/sentineldesk
      # Wallpapers. The path is relative to THIS file, and this file lives in
      # deploy/ while the images live at the repository root — hence the "..".
      # Images in there are dealt across the workspaces at start.
      - ../wallpaper:/wallpaper:ro
      # The record of what happened here, which until now did not survive a
      # restart.
      #
      # Three things live under these two paths: the agent's action log
      # (actions.jsonl, append-only, rotated), every job's stdout and stderr kept
      # apart on disk, and the shared shell log that records what the PEOPLE at
      # this desktop typed. All of it was in the container's writable layer, and
      # /tmp doubly so — so a `make down`, or a crash, took the whole transcript
      # with it.
      #
      # That is a strange thing for this project to have shipped. The audit trail
      # is opened O_APPEND with a 64MB rotation and the two shell logs exist
      # specifically so a person and an agent can each read what the other did;
      # none of that is worth building if a restart erases it. A desktop that can
      # be asked "what did you run yesterday" and answers "nothing" is not
      # keeping a record, it is keeping a buffer.
      - sentineldesk-audit:/var/log/sentineldesk
      - sentineldesk-work:/tmp/sentineldesk
      # Recordings and saved screenshots, as a BIND rather than a named volume.
      #
      # They already survived — /home/sentineldesk is persistent — but a named
      # volume has no path on the host worth typing. On Linux it is buried under
      # /var/lib/docker/volumes; on macOS and Windows it is inside a virtual
      # machine and there is no host path at all, so the only way to a video was
      # `docker cp`. A recording nobody can open is a recording that did not
      # happen, and the point of the feature is handing somebody the file.
      - ../recordings:/home/sentineldesk/Recordings
    # A VPN client needs a tunnel device and the capability to configure
    # routes. Without both, openvpn and wg install fine and then fail at the
    # moment somebody actually needs them.
    #
    # NET_ADMIN is a real grant, worth naming: it lets the container manage its
    # own network stack — interfaces, routes, iptables. Drop both lines on a
    # deployment that never dials a VPN.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    shm_size: "2g"
    restart: unless-stopped

  # TURN: a relay for traversing NAT — required on macOS/Docker Desktop, and a
  # recommended fallback in production for clients behind restrictive NAT.
  coturn:
    image: coturn/coturn:latest
    container_name: sentineldesk-turn
    command: >-
      -n --log-file=stdout --fingerprint --lt-cred-mech
      --user=${TURN_USER:-webrtc}:${TURN_PASS:-webrtc123}
      --realm=sentineldesk --listening-port=3478
      --min-port=49160 --max-port=49200 --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  sentineldesk-home:
    # Explicit, for the same reason: the home holds real state (browser
    # profiles, installed applications) and must survive a reorganisation.
    name: sentineldesk-home
  sentineldesk-audit:
    # The action log. Named explicitly like the home, and for a stronger reason:
    # an audit trail that a `docker compose down -v` or a project rename can
    # silently take away is not one.
    name: sentineldesk-audit
  sentineldesk-work:
    # Job output and the shared shell log. Named rather than anonymous so that
    # what a person typed here yesterday is still readable today.
    name: sentineldesk-work
