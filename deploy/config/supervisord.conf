; WHO THE DESKTOP RUNS AS, told to this file from outside.
;
;   DESKTOP_USER   the account every program drops to
;   DESKTOP_HOME   its home directory
;   RUNTIME_DIR    its XDG runtime directory
;
; Whatever starts supervisord exports all three: deploy/config/entrypoint.sh in
; the container, /usr/local/bin/sentineldesk-session on a native install. Leave
; one unset and supervisord refuses to expand it and stops with an error naming
; the variable, which is the right way to fail.
;
; They were the literals sentineldesk, /home/sentineldesk and /run/user/1000,
; ten times each, and that is what kept the native installer off any machine
; with a person on it. useradd hands 1000 to the first real user on Debian,
; Ubuntu and Raspberry Pi OS alike, so the installer had to refuse when it was
; taken — leaving native mode working only on a box with nothing but root.
;
; Pointing a second user at /run/user/1000 anyway is not the answer:
; systemd-logind owns that directory for whoever actually IS uid 1000 and
; recreates it on their every login, so PulseAudio and D-Bus would be sharing a
; path with a process that has its own ideas about it. The directory follows the
; user instead. (An installation that runs as an EXISTING account needs
; `loginctl enable-linger` for the same reason, and the installer does it.)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The control socket: without it `supervisorctl` has nothing to talk to, and the
; MCP's service_control tool (restarting X, audio, the WM) can do nothing.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -ac -nolisten tcp -noreset
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
command=/usr/bin/pulseaudio -n --file=/etc/pulse/sentineldesk.pa --daemonize=no --exit-idle-time=-1 --disallow-exit
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; A D-Bus session bus at a FIXED address: AT-SPI and every application have to
; share it for the accessibility tree (the ui_* tools) to work.
[program:dbus-session]
command=/usr/bin/dbus-daemon --session --address=unix:path=%(ENV_RUNTIME_DIR)s/bus --nofork --nopidfile
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=15
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The accessibility bus: it publishes AT_SPI_BUS on the root window; GTK/Qt
; applications register there and expose their UI as a queryable tree.
[program:at-spi]
command=/usr/local/bin/wait-x11.sh /usr/libexec/at-spi-bus-launcher --launch-immediately
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus"
priority=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/wait-x11.sh /usr/bin/openbox
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop-init]
# Waits for X like everything else that touches the display. It used to start
# immediately, which was harmless while it only copied files into the home —
# and became a race the moment it started applying the keyboard layout, which
# needs a server to apply it to.
command=/usr/local/bin/wait-x11.sh /usr/local/bin/desktop-init.sh
user=%(ENV_DESKTOP_USER)s
; The bus address is here because the wallpaper landed in xfconf when
; xfdesktop took the root window: desktop-init pins the backdrop through
; xfconf-query, which talks to xfconfd over the session bus.
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus"
priority=35
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Desktop icons and wallpaper: xfdesktop owns the root window. It replaced
; pcmanfm's desktop mode (2026-08-19) for one capability pcmanfm does not
; have: a different wallpaper on each of the four workspaces, which is how a
; glance at the stream answers "which workspace is this". It reads its
; backdrops from xfconf over the session bus, so the bus address is part of
; its environment, and it is GTK — the AT-SPI wiring keeps the desktop icons
; readable to the agent like every other widget on screen.
[program:xfdesktop]
command=/usr/local/bin/wait-wm.sh /usr/bin/xfdesktop
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0"
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The panel. xfce4-panel replaced lxpanel (2026-08-19): Whisker menu,
; launchers, pager with the four workspaces numbered, the genmon status line,
; volume, clipboard history, notification bell, keyboard indicator, tray,
; clock. Configuration is the skeleton's xfce4-panel.xml — a factory default,
; editable from inside the room through the panel's own preferences dialog.
;
; --disable-wm-check because supervisord starts the panel and the WM in
; parallel: wait-wm.sh already guarantees Openbox is up, and the panel's own
; check races against session managers this desktop does not run.
;
; (lxpanel's stderr used to be split into its own capped file over a measured
; 171-line GLib burst at every start; xfce4-panel has no such burst, so its
; stderr rejoins the container log where everything else already is.)
[program:xfce4-panel]
command=/usr/local/bin/wait-wm.sh /usr/bin/xfce4-panel --disable-wm-check
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0"
priority=45
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; NOT here on purpose: xfce4-notifyd. The session bus starts it on the first
; notification (org.xfce.Notifyd is a D-Bus activated service), which is both
; the normal way it runs and the way that spares this file an architecture-
; dependent path — the daemon lives under /usr/lib/<triplet>/xfce4/notifyd/,
; and this image builds for two triplets.

; The system card: clock, date, CPU / RAM / disk, drawn on the desktop by
; conky as a dark card in the upper right. Display only — it injects nothing
; and reads nothing but /proc, so it sits outside the control-arbitration
; story entirely.
[program:conky]
command=/usr/local/bin/wait-wm.sh /usr/bin/conky
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=46
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The STREAM card, its own widget under the system card: both halves of the
; stream's story (what the desktop sends, what each viewer reports back) and
; the bitrate sparkline drawn by Lua. Separate process on purpose — the
; system card is about the hardware, this one is about the product, and
; either can be restarted without blinking the other.
[program:conky-stream]
command=/usr/local/bin/wait-wm.sh /usr/bin/conky -c %(ENV_DESKTOP_HOME)s/.config/conky/conky-stream.conf
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=46
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Sticky notes. xpad restores whatever pads the home already holds and mints
; one empty pad on a fresh home; everything typed into them persists as plain
; files under ~/.config/xpad — the golden rule applied to a widget: what a
; person jots down, the agent can read.
[program:xpad]
command=/usr/local/bin/wait-wm.sh /usr/bin/xpad
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0"
priority=46
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sentineldesk]
command=/usr/local/bin/wait-x11.sh /usr/local/bin/sentineldesk
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",MCP_SOCK="%(ENV_MCP_SOCK)s",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
