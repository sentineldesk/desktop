--
-- The STREAM card: its own widget below the system card, at the owner's ask
-- — the system card is about the hardware, this one is about the product,
-- and separate cards let each breathe. It wears both halves of the stream's
-- story: what this desktop is sending (streamstatus.go writes it every
-- second) and what each viewer reports it is receiving, driver first. The
-- sparkline underneath is the last minute of real sent bitrate, drawn by
-- conky-spark.lua as the same thin autoscaled polyline the browser's
-- Statistics panel draws — the EEG, one heartbeat per second.

conky.config = {
    background = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '0d1110',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    use_xft = true,
    font = 'JetBrains Mono:size=10',
    update_interval = 1.0,
    alignment = 'top_right',
    gap_x = 56,
    gap_y = 530,
    minimum_width = 300,
    maximum_width = 300,
    border_inner_margin = 22,
    default_color = 'e7edea',
    color1 = '3fd68c',
    color2 = '93a09a',
    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    lua_load = '/usr/local/bin/conky-spark.lua',
    lua_draw_hook_post = 'spark',
}

conky.text = [[
${color1}${font Roboto:bold:size=9}S T R E A M${font}${color}
${execpi 1 /usr/local/bin/sentineldesk-stream-card.sh}
${voffset 32}
]]
