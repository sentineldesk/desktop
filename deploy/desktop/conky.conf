--
-- The desktop's system card: clock, date, host, CPU / RAM / disk, drawn by
-- conky in the upper right. It is a DARK card on the light wallpaper, and
-- that is a commitment, not a fallback dressed up: this desktop runs no
-- compositor (measured — picom took an Xvfb from 31% to 81% of a core just
-- dragging a window), so real transparency does not exist here, and pseudo-
-- transparency sampling the root pixmap fights xfdesktop's per-workspace
-- backdrops. The card paints the same #0d1110 the panel and the terminal
-- wear instead: one more dark object sitting on the desk.
--
-- Anchored to the corner by design — it is a dashboard, not a window. The
-- sticky note (xpad) is the movable one.

-- own_window_type 'normal', not 'desktop' and not 'dock', and it was found
-- the empirical way: a second desktop-type window races xfdesktop for
-- stacking and loses invisibly (the card ran, drew, and no pixel of it ever
-- reached the screen), and dock placement lands wherever the WM feels like.
-- A normal window with these hints sits above the backdrop, below every real
-- window, on all workspaces, and out of the tasklist — which is exactly what
-- a widget is.
conky.config = {
    background = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '0d1110',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    use_xft = true,
    font = 'JetBrains Mono:size=10',
    update_interval = 1.0,
    alignment = 'top_right',
    gap_x = 56,
    gap_y = 84,
    minimum_width = 300,
    maximum_width = 300,
    border_inner_margin = 22,
    default_color = 'e7edea',
    color1 = '3fd68c',
    color2 = '93a09a',
    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    cpu_avg_samples = 2,
    short_units = true,
    default_bar_height = 7,
    default_bar_width = 200,
    -- Only the hairline border from the shared Lua; the sparkline half of
    -- that file belongs to the stream card.
    lua_load = '/usr/local/bin/conky-spark.lua',
    lua_draw_hook_post = 'card_border',
}

conky.text = [[
${font Roboto:bold:size=44}${time %H:%M}${font}
${color2}${font Roboto:size=13}${time %A, %d %B %Y}${font}${color}

${color1}${font Roboto:bold:size=9}S Y S T E M${font}${color}
${color2}host ${color}${nodename}    ${color2}up ${color}${uptime_short}

${color1}${font Roboto:bold:size=9}C P U${font}${color}   ${cpu cpu0}%
${color1}${cpubar cpu0}${color}

${color1}${font Roboto:bold:size=9}R A M${font}${color}   ${mem} / ${memmax}
${color1}${membar}${color}

${color1}${font Roboto:bold:size=9}D I S K${font}${color}  ${fs_used /} / ${fs_size /}
${color1}${fs_bar /}${color}

]]
