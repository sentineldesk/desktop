# Chromium flags for running inside the container:
# - a small /dev/shm
# - CDP on 9222: the browser_* tools drive the real DOM instead of the picture
# - forced accessibility: the web UI also shows up in the AT-SPI tree (ui_*)
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins=* --force-renderer-accessibility --no-first-run"

# --no-first-run is load-bearing, not cosmetic. Chromium 151 (Debian's
# 151.0.7922.169) gates startup behind a first-run ceremony: until it is
# clicked through, every fresh profile shows an "Additional Terms of
# Service" dialog whose body Debian ships INTENTIONALLY BLANK — and, worse,
# the DevTools server never starts, so CDP on 9222 answers nothing and the
# agent's browser_* tools are born dead in every new room, silently. The
# flag skips the ceremony; there are no terms in it to accept.

# The kernel sandbox, asked for rather than assumed.
#
# This line used to be an unconditional --no-sandbox, annotated "user namespaces
# are not available here". That holds under Docker's default seccomp profile,
# which blocks clone(CLONE_NEWUSER), and stops holding the moment anybody adds
#
#     security_opt:
#       - seccomp:unconfined
#
# which the README still documents for Steam's bootstrap — it needs exactly
# those namespaces. One flag was covering both cases by assuming the worse one,
# so a machine that could afford a sandbox went without.
#
# So ask instead. Where namespaces work the sandbox stays on; where they do not,
# the flag is added and Chromium still starts. Under the shipped compose files
# the answer is currently "they do not", and Chromium says so in a banner across
# the top of the window — that banner is this check reporting its result, not a
# flag somebody left switched on.
#
# Neither the DevTools protocol nor the accessibility tree is affected either
# way. Both were checked against a running desktop with the sandbox enabled: CDP
# answered on 9222 and reported the open page, and the ui_* bridge found the
# page's own buttons by name.
if ! unshare --user --map-root-user true 2>/dev/null; then
    export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-sandbox"
fi
