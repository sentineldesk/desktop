# On the palette the rest of the desktop uses, rather than the pure black and
# pure white a terminal defaults to. #0d1110 is the same surface as the frames
# and the panel, so a terminal sitting on this desktop belongs to it — and the
# slightly-off white is easier to read for the hours somebody actually spends
# in here than #ffffff on #000000, which is the highest contrast available and
# not the most legible.
[general]
fontname=JetBrains Mono 10
bgcolor=#0d1110
fgcolor=#E7EDEA
cursorblinks=true
scrollback=2000
hidemenubar=false
