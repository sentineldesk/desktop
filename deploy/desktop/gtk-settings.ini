# The applications, matched to the frames around them.
#
# This used to ask for the light Adwaita, which put a white menu bar directly
# under a near-black title bar on every GTK window on the desktop — the single
# loudest thing in a screenshot of this desktop, and louder than the missing
# corners it was competing with. The frame was never the problem.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
gtk-application-prefer-dark-theme=1
gtk-font-name=Roboto 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-menu-images=1
gtk-button-images=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
