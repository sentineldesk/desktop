# tmux is load-bearing here, not a convenience.
#
# The terminal tools address the shell through a pane rather than through the X
# server: terminal_run writes to the pty instead of typing with xdotool, and
# terminal_read captures the pane instead of walking the accessibility tree.
# That is why it is in the image and why this file styles it — a person opening
# a terminal on this desktop is inside tmux whether or not they asked to be, so
# it has to look like it belongs rather than like scaffolding somebody left out.
#
# Which is exactly what it did: tmux ships a status bar in bright green, and it
# sat across the bottom of a desktop whose entire palette is muted phosphor on
# near-black. It was the loudest object on the screen.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# The status bar, on the palette the rest of the desktop uses: #0d1110 surface,
# #93A09A for text that is context, #3FD68C for the one thing that is live.
set -g status-style "bg=#0d1110,fg=#93A09A"
set -g status-left  " #[fg=#3FD68C]●#[fg=#93A09A] #S "
set -g status-right " #[fg=#6b7671]#h  #[fg=#93A09A]%H:%M "
set -g status-left-length 40
set -g status-right-length 40

setw -g window-status-current-style "fg=#E7EDEA,bold"
setw -g window-status-style "fg=#6b7671"
setw -g window-status-separator "  "

set -g pane-border-style "fg=#2a3230"
set -g pane-active-border-style "fg=#3FD68C"
set -g message-style "bg=#141917,fg=#E7EDEA"
set -g mode-style "bg=#3FD68C,fg=#052B17"

# Scrollback deep enough that terminal_read can be asked for history somebody
# actually wants, rather than the two screens tmux defaults to.
set -g history-limit 20000

# The mouse, because a person sharing this desktop reaches for it before they
# reach for a prefix key, and without this their scroll wheel sends arrow keys
# to the shell instead of scrolling the pane.
set -g mouse on

# Windows and panes numbered from 1: the 0 key is the furthest from the hand and
# tmux puts the first window behind it.
set -g base-index 1
setw -g pane-base-index 1
