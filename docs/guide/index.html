<!--
  Project documentation, served by the desktop itself.

  It lives here rather than on a website because the thing it documents is
  already a web server, and because the instructions have to be reachable from
  the machine that is running: /docs/?lang=es#capture-stream-out opens the right
  section in the right language, and the rail links straight to it.

  It deliberately opens in the VIEWER's browser, not inside the virtual desktop.
  Half of what it explains is how to operate the control layer, and reading that
  through the video stream would mean fighting for control to scroll it. The
  other half is commands to run on your own machine, which is the side of the
  screen the reader is already on.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentinelDesk — Documentation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='38' rx='6' fill='%233FD68C'/%3E%3Crect x='10' y='14' width='44' height='26' rx='2' fill='%230C0E0D'/%3E%3Crect x='22' y='50' width='20' height='4' rx='2' fill='%233FD68C'/%3E%3Crect x='16' y='54' width='32' height='4' rx='2' fill='%232AA96C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="docs.css">
</head>
<body>
  <a class="skip" href="#doc">Skip to content</a>

  <!-- The bar the rest of the site wears, and the reason is not decoration: the
       guide is part of the product, not a document that happens to be about it.
       Same brand, same destinations, same language switch, same primary action
       in the same corner, so arriving here from the site does not feel like
       leaving it.

       It carries the language switch, which used to live in the sidebar. Two
       switches would be two answers to one question; the sidebar keeps what is
       actually its own — the contents of this document. -->
  <header>
    <div class="wrap">
      <a class="brand" href="../index.html" aria-label="SentinelDesk">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect class="scr" x="4" y="8" width="56" height="38" rx="6"></rect>
          <rect class="gls" x="10" y="14" width="44" height="26" rx="2"></rect>
          <rect class="scr" x="22" y="50" width="20" height="4" rx="2"></rect>
          <rect class="std" x="16" y="54" width="32" height="4" rx="2"></rect>
        </svg>
        <span>SentinelDesk</span>
      </a>
      <nav aria-label="Main">
        <a id="nav-arch" href="../arquitectura.html">Architecture</a>
        <a id="nav-install" href="index.html#install">Installation</a>
        <a class="hide-sm" href="https://github.com/sentineldesk/desktop/blob/main/docs/mcp.md">MCP</a>
        <a class="ghub" href="https://github.com/sentineldesk/desktop"
           aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.01-.02-1.99-3.2.7-3.87-1.54-3.87-1.54-.53-1.34-1.29-1.69-1.29-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.11-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>

        <div class="langs" id="langs" role="group" aria-label="Language"></div>
        <a id="nav-start" class="btn btn-primary btn-sm" href="index.html#install">Get started</a>
      </nav>
    </div>
  </header>

  <!-- Two buttons rather than one that moves: the handle that opens the panel
       has to stay reachable when the panel is gone, and the one that closes it
       belongs inside what it closes. -->
  <button id="side-open" aria-expanded="false" aria-controls="side" aria-label="Contents">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <!-- The brand used to open this panel and the language switch used to sit
       under it. Both moved into the bar above, which is the only place they can
       be on a page that has one: two brands stacked forty pixels apart read as
       a mistake, and two language switches are two answers to one question.
       What is left here belongs to the panel — its contents, and the control
       that closes it. -->
  <aside id="side">
    <div class="head">
      <button id="side-close" aria-controls="side" aria-label="Hide contents">
        <svg viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5"/><path d="M19 5v14"/></svg>
      </button>
    </div>
    <p class="tagline" id="tagline"></p>

    <div id="search-box">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             aria-label="Search the guide" placeholder="Search…">
      <p id="search-empty" hidden></p>
    </div>

    <nav id="toc" aria-label="Contents"></nav>

    <div class="side-foot">
      <a href="../index.html" id="back-link">← Back to the desktop</a>
    </div>
  </aside>

  <main id="doc" tabindex="-1">
    <div id="content"><p class="loading">Loading…</p></div>
  </main>

  <script src="docs.js"></script>
</body>
</html>
